<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="WikiEngram: Train Memory, Not Your LLM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>

  <!-- wiki pages -->
  <g transform="translate(70,92)">
    <rect x="18" y="-12" width="120" height="150" rx="10" fill="#334155"/>
    <rect x="0" y="0" width="120" height="150" rx="10" fill="#e2e8f0"/>
    <rect x="16" y="20" width="70" height="9" rx="4" fill="#0f172a"/>
    <rect x="16" y="44" width="88" height="6" rx="3" fill="#94a3b8"/>
    <rect x="16" y="60" width="80" height="6" rx="3" fill="#94a3b8"/>
    <rect x="16" y="76" width="88" height="6" rx="3" fill="#94a3b8"/>
    <rect x="16" y="92" width="60" height="6" rx="3" fill="#94a3b8"/>
    <rect x="16" y="112" width="84" height="6" rx="3" fill="#38bdf8"/>
    <text x="60" y="182" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#cbd5e1" text-anchor="middle">LLMWiki</text>
  </g>

  <!-- arrow -->
  <path d="M232 167 H 300" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  <path d="M292 155 L 308 167 L 292 179" fill="none" stroke="#a78bfa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- engram table: frozen rows with a few personal-delta rows lit -->
  <g transform="translate(330,92)">
    <g fill="#334155">
      <rect x="0" y="0" width="22" height="22" rx="4"/><rect x="28" y="0" width="22" height="22" rx="4"/><rect x="56" y="0" width="22" height="22" rx="4"/><rect x="84" y="0" width="22" height="22" rx="4"/><rect x="112" y="0" width="22" height="22" rx="4"/>
      <rect x="0" y="28" width="22" height="22" rx="4"/><rect x="56" y="28" width="22" height="22" rx="4"/><rect x="84" y="28" width="22" height="22" rx="4"/><rect x="112" y="28" width="22" height="22" rx="4"/>
      <rect x="0" y="56" width="22" height="22" rx="4"/><rect x="28" y="56" width="22" height="22" rx="4"/><rect x="56" y="56" width="22" height="22" rx="4"/><rect x="112" y="56" width="22" height="22" rx="4"/>
      <rect x="28" y="84" width="22" height="22" rx="4"/><rect x="56" y="84" width="22" height="22" rx="4"/><rect x="84" y="84" width="22" height="22" rx="4"/><rect x="112" y="84" width="22" height="22" rx="4"/>
      <rect x="0" y="112" width="22" height="22" rx="4"/><rect x="28" y="112" width="22" height="22" rx="4"/><rect x="84" y="112" width="22" height="22" rx="4"/><rect x="112" y="112" width="22" height="22" rx="4"/>
    </g>
    <g fill="url(#accent)">
      <rect x="28" y="28" width="22" height="22" rx="4"/>
      <rect x="84" y="56" width="22" height="22" rx="4"/>
      <rect x="0" y="84" width="22" height="22" rx="4"/>
      <rect x="56" y="112" width="22" height="22" rx="4"/>
    </g>
    <text x="67" y="182" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#cbd5e1" text-anchor="middle">Engram</text>
  </g>

  <!-- title -->
  <text x="540" y="160" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#f8fafc">WikiEngram</text>
  <text x="543" y="214" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="url(#accent)">Train Memory, Not Your LLM.</text>
  <text x="543" y="258" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8">Long-term memory for LLMs and agents, trained into the model's</text>
  <text x="543" y="284" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8">own n-gram memory. The model itself never changes.</text>
</svg>
