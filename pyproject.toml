[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wikiengram"
version = "0.1.0"
description = "Train Memory, Not Your LLM. Consolidate an LLM-maintained wiki into the Engram conditional memory of MoE models while the backbone stays frozen."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "WikiEngram contributors" }]
keywords = ["llm", "memory", "engram", "conditional-memory", "moe", "knowledge", "wiki", "continual-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.4",
  "numpy>=1.24",
  "safetensors>=0.4",
  "tokenizers>=0.19",
  "transformers>=4.51",
  "accelerate>=1.0",
  "psutil>=5.9",
  "huggingface_hub>=0.23",
  "typer>=0.12",
  "httpx>=0.27",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.5"]
data = ["pyarrow>=14"]
mcp = ["mcp>=1.10"]
dev = ["pytest>=8", "ruff>=0.5", "sympy>=1.12", "fastapi>=0.110", "pydantic>=2.5", "httpx>=0.27", "mcp>=1.10"]

[project.scripts]
wikiengram = "wikiengram.cli:app"

[project.urls]
Homepage = "https://github.com/Zihao-Wu06/WikiEngram"
Issues = "https://github.com/Zihao-Wu06/WikiEngram/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wikiengram = ["py.typed", "data/*.txt", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: needs internet access (downloads tokenizers or models)",
  "slow: loads a real pretrained model; skipped unless WIKIENGRAM_SLOW=1",
]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["tests/reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "UP007", "B905"]
